name: Release APK

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Without this, a merge that forgets to bump versionName fails at the very
      # last step, after a full build, with a confusing error from the release
      # action. Failing here says exactly what is wrong.
      - name: Refuse to publish a version that already exists
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump versionName in app/build.gradle.kts."
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Build Release APK
        # Scoped to :app. The repository also holds tools/sender, a test harness that has
        # no business being built as part of a release.
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # Derived from the run number rather than maintained by hand. A
          # versionCode that somebody forgot to raise is the usual reason an
          # update refuses to install, and it is the one field with no reason to
          # be manual.
          VERSION_CODE: ${{ github.run_number }}

      # Published beside the APK so the in-app updater can tell a truncated download from a
      # complete one before it hands anything to the package installer. It is not a signature
      # and is not treated as one: whoever could replace the APK could replace this too, which
      # is why the updater's real check is that the APK is signed with the key already
      # installed on the phone.
      - name: Publish a digest beside the APK
        run: |
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
