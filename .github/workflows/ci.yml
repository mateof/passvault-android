name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      # The reference vectors are the contract with the server's TypeScript
      # implementation of the .tkpak format. If this fails, one of the two
      # readers has drifted — which is the failure a duplicated format is prone
      # to and the reason the vectors exist.
      - name: Interchange format vectors
        run: ./gradlew :app:testDebugUnitTest --tests '*TkpakVector*'
