[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
compose-bom = "2024.12.01"
hilt = "2.53.1"
hilt-navigation-compose = "1.2.0"
navigation = "2.8.5"
lifecycle = "2.8.7"
core-ktx = "1.15.0"
activity-compose = "1.9.3"
coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"
datastore = "1.1.1"
room = "2.6.1"
security-crypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"
# Credential Manager: the only supported way to use a passkey from an Android app since 14,
# and the one that shows the same sheet the system uses for passwords.
credentials = "1.3.0"
splashscreen = "1.0.1"
desugar = "2.1.4"
okhttp = "4.12.0"
retrofit = "2.11.0"
# ZXing rather than ML Kit: ML Kit needs Play Services or a bundled model of
# several megabytes, and an app whose main claim is working without a server
# should not require Google's to read a PDF. Same library as the server, so both
# implementations agree on what a barcode says.
zxing = "3.5.3"
# PdfBox-Android for splitting; the platform's own PdfRenderer does the raster.
pdfbox-android = "2.0.27.0"
# Bouncy Castle, used through its lightweight API rather than as a JCE provider.
# It supplies all three primitives the interchange format needs — Argon2id,
# Ed25519 and X25519 — none of which the platform offers on minSdk 26, and it
# needs no JNI, so the same code runs in a JVM unit test and on a phone.
bouncycastle = "1.79"
junit = "4.13.2"
androidx-test-junit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.14.1"
truth = "1.4.4"
turbine = "1.2.0"
coroutines-test = "1.9.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
